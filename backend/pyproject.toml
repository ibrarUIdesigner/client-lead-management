[project]
name = "client-acquisition-api"
version = "0.1.0"
description = "API for the Client Acquisition Tool"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.136",
  "uvicorn[standard]>=0.35",
  "pydantic-settings>=2.11",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.20",
  "playwright>=1.49",
  "httpx>=0.28",
  "apscheduler>=3.11",
  "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "httpx>=0.28",
  "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
