name: Pipeline tick

# Vercel Hobby only runs cron once a day. This workflow calls the app every 10 minutes
# so the pipeline can advance leads and replies are picked up quickly.
# GitHub may delay scheduled runs by a few minutes. That is fine: every step is safe to repeat.
#
# Required repository secrets:
#   APP_URL      https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in the Vercel project settings

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: pipeline-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Run pipeline tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL}" ] || [ -z "${CRON_SECRET}" ]; then
            echo "APP_URL and CRON_SECRET secrets are required." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 290 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/v1/jobs/tick"
          echo
      - name: Sync Gmail replies
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL}/api/v1/jobs/gmail-sync"
          echo
